apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-yourphr-sandbox-credentials
  namespace: demo-yourphr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: demo-yourphr-sandbox-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deby/demo-yourphr/demo-yourphr-sandbox-credentials
