apiVersion: v1
kind: PersistentVolume
metadata:
  name: demo-yourphr-data-pv
  labels:
    app: demo-yourphr
    type: data
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  # Retain, not Delete — this is a throwaway demo volume, but a wipe should be an explicit
  # operator action (docs/demo-yourphr-org/implementation-plan.md), not a side effect of the
  # PVC being deleted or recreated. Never bind this to the ops yourphr-data PVC/PV.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/local-k3s-data/demo-yourphr
    type: DirectoryOrCreate
