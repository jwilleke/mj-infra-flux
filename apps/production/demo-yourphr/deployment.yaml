apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-yourphr
  namespace: demo-yourphr
  labels:
    app: demo-yourphr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-yourphr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: demo-yourphr
    spec:
      containers:
        - name: demo-yourphr
          # Public, throwaway CMS Blue Button demo instance — no real PHI, sandbox Medicare only.
          # docs/demo-yourphr-org/implementation-plan.md (mj-infra-flux#147). Shares the ops yourphr
          # ImagePolicy (flux-system:yourphr); a separate ImageUpdateAutomation path (Phase 5) bumps
          # this file independently of apps/production/yourphr/deployment.yaml.
          image: ghcr.io/jwilleke/yourphr:2.8.0 # {"$imagepolicy": "flux-system:yourphr"}
          ports:
            - containerPort: 8080
              name: http
          env:
            # Instance data root (yourphr#451). Everything the instance owns and must not lose:
            # the DB, the generated JWT signing key, backups, and — as of yourphr#452 — the
            # instance custom config store at <root>/config/app-custom-config.json (operator
            # contact, theme).
            #
            # MUST equal the demo-yourphr-data PVC mountPath below. Before this key existed the
            # root was derived from database.location's parent, which resolves to the same
            # /opt/fasten/db — so this is explicit documentation of current behaviour, not a
            # move. Point it anywhere outside the PVC and the config store lands on the
            # container filesystem and is silently lost on every pod restart. The demo PV is a
            # hostPath (/mnt/local-k3s-data/demo-yourphr), so "outside the PVC" here means
            # outside that directory on the node.
            - name: YOURPHR_STORAGE_DATA_DIR
              value: "/opt/fasten/db"
            # Explicit ahead of retiring the config.yaml ConfigMap (yourphr#470). The ConfigMap
            # currently sets cache.location to this same value; the shipped default is
            # /opt/fasten/cache/, which is NOT on the yourphr-data volume. Removing the ConfigMap
            # without this would silently relocate the cache onto the container filesystem.
            # Redundant while the ConfigMap remains — deliberately, so this step changes nothing.
            - name: YOURPHR_CACHE_LOCATION
              value: "/opt/fasten/db/fasten.cache.db"
            # Pinned ahead of yourphr#470: the image's baked config.yaml (which set
            # database.encryption.enabled: true) is being removed, and the shipped default flips
            # to true to preserve behaviour for stock Docker installs that already have encrypted
            # databases. This instance runs UNENCRYPTED — it relied on that value being shadowed
            # by the ConfigMap — so pin it explicitly before the default changes.
            # Note: enabling encryption also disables backup and restore (yourphr#367).
            - name: YOURPHR_DATABASE_ENCRYPTION_ENABLED
              value: "false"
            # Demo has no cda-converter sidecar, and the shipped default is flipping to enabled
            # with a compose-network URL. Pin it off so XML upload fails clearly rather than
            # timing out against a host that does not resolve here.
            - name: YOURPHR_CDA_CONVERTER_ENABLED
              value: "false"
            # In-cluster poll — never the public relay hostname. Same hairpin-avoidance rule as prod
            # (yourphr#51): the backend runs inside the cluster, so it reaches the demo relay pod
            # directly over the ClusterIP Service instead of round-tripping through Cloudflare.
            - name: YOURPHR_RELAY_URL
              value: "http://demo-yourphr-relay.demo-yourphr.svc.cluster.local:8080"
            # Public origin the PROVIDER redirects the user's browser to — must be reachable from
            # the internet, unlike YOURPHR_RELAY_URL above (backend/pkg/relay/relay.go: relay.public_url).
            - name: YOURPHR_RELAY_PUBLIC_URL
              value: "https://demo-relay.yourphr.org"
            # Shared secret for polling the demo relay's /pending. From ./relay-secret.sops.yaml
            # (Phase 3/4 — not created yet); optional so this Deployment can ship ahead of that.
            - name: YOURPHR_RELAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-yourphr-relay
                  key: YOURPHR_RELAY_SECRET
                  optional: true
            # Instance tag on backup filenames — harmless with no backup destination configured;
            # kept for parity with prod in case a destination is ever added ad hoc via Admin -> Database.
            - name: YOURPHR_BACKUP_LABEL
              value: "demo"
            # Patient-friendly medication names via the embedded (offline) RxTerms crosswalk. No
            # external calls, so safe to enable on the public demo — improves what CMS reviewers see.
            - name: YOURPHR_MEDICATIONS_RXTERMS_ENRICH
              value: "true"
            # Sandbox Blue Button only (yourphr#433's CMS demo script) — no production keys, no other
            # sandbox providers. From ./sandbox-credentials.sops.yaml (Phase 3/4 — not created yet);
            # optional so this Deployment can ship ahead of that, same as prod's pattern.
            - name: YOURPHR_SANDBOX_BLUEBUTTON_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: demo-yourphr-sandbox-credentials
                  key: YOURPHR_SANDBOX_BLUEBUTTON_CLIENT_ID
                  optional: true
            - name: YOURPHR_SANDBOX_BLUEBUTTON_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: demo-yourphr-sandbox-credentials
                  key: YOURPHR_SANDBOX_BLUEBUTTON_CLIENT_SECRET
                  optional: true
          volumeMounts:
            - name: demo-yourphr-data
              mountPath: /opt/fasten/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Matches prod's headroom rather than a demo-scaled-down limit — this instance only
              # gets exercised live during the CMS Zoom demo, so reliability there matters more than
              # trimming resources on a node with plenty to spare.
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: demo-yourphr-data
          persistentVolumeClaim:
            claimName: demo-yourphr-data
