apiVersion: v1
kind: ConfigMap
metadata:
  name: ngdpbase-demo-config
  namespace: ngdpbase-demo
data:
  # Mounted at /app/data/config/app-custom-config.json via subPath.
  # ConfigurationManager reads instance overrides from
  # INSTANCE_DATA_FOLDER/config/app-custom-config.json and deep-merges them over
  # config/app-default-config.json shipped in the image.
  #
  # `$VAR` values are env-refs resolved at read time (ngdpbase #775): the config
  # stays readable in git while the credential itself arrives from the Secret as
  # an environment variable. A `$VAR` whose env var is unset throws at startup
  # with the key named, so a missing secret fails loudly instead of silently
  # sending no mail.
  app-custom-config.json: |
    {
      "ngdpbase.application-name": "Demo ngdpbase",
      "ngdpbase.application.base-url": "https://ngdpbase-demo.nerdsbythehour.com",

      "ngdpbase.application.organization.file": "ngdpbase-demo-nerdsbythehour-com.json",

      "ngdpbase.user.security.defaultpassword": "$NGDPBASE_ADMIN_PASSWORD",

      "ngdpbase.application.registration": true,
      "ngdpbase.application.registration.password": false,

      "ngdpbase.auth.magic-link.enabled": true,
      "ngdpbase.auth.magic-link.auto-provision": true,
      "ngdpbase.auth.magic-link.registration.default-role": "contributor",
      "ngdpbase.auth.magic-link.ttl-minutes": 15,

      "ngdpbase.mail.enabled": true,
      "ngdpbase.mail.provider": "smtp",
      "ngdpbase.mail.provider.smtp.host": "smtp.resend.com",
      "ngdpbase.mail.provider.smtp.port": 587,
      "ngdpbase.mail.provider.smtp.secure": false,
      "ngdpbase.mail.provider.smtp.user": "resend",
      "ngdpbase.mail.provider.smtp.pass": "$NGDPBASE_SMTP_PASS",
      "ngdpbase.mail.provider.smtp.from": "$NGDPBASE_MAIL_FROM",

      "ngdpbase.mail.rate-limit.enabled": true,
      "ngdpbase.mail.rate-limit.max-submissions": 5,
      "ngdpbase.mail.rate-limit.window-minutes": 15,
      "ngdpbase.mail.honeypot.enabled": true
    }

  # The install's anchor Organization (ngdpbase#1027).
  #
  # NOT optional infrastructure decoration: UserManager.syncRoleAdd resolves
  # Person → Role membership through OrganizationManager.getInstallOrg(), and
  # returns early when there is no anchor org. Without this file NO role is ever
  # assigned to ANY user — the default admin never receives `admin`, magic-link
  # signups never receive `contributor`, and nobody can edit or reach /admin.
  # Headless installs do not seed this (InstallService.processHeadlessInstallation
  # says so explicitly); it must be pre-supplied, which the first version of this
  # app failed to do.
  #
  # Deliberately MINIMAL. The ops instance's org record carries a postal address,
  # telephone and personal email; this one is public and renders through the org
  # UI and schema.org markup, so it carries none of that.
  ngdpbase-demo-nerdsbythehour-com.json: |
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://ngdpbase-demo.nerdsbythehour.com/",
      "name": "Demo ngdpbase",
      "url": "https://ngdpbase-demo.nerdsbythehour.com/",
      "description": "Public demo instance of ngdpbase. Content is disposable and not backed up.",
      "alternateName": "https://github.com/jwilleke/ngdpbase"
    }
