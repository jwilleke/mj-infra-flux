apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Public, throwaway demo of stock ngdpbase at ngdpbase-demo.nerdsbythehour.com
# (ngdpbase#1026). Own namespace, own node-local volume, no Authentik — exposed
# through the shared Cloudflare Tunnel, same pattern as demo-yourphr. Never
# bind an ops PVC here; the wipe runbook in README.md deletes the whole volume.

resources:
  - ./namespace.yaml
  - ./pv.yaml
  - ./pvc.yaml
  - ./configmap.yaml
  - ./deployment.yaml
  - ./service.yaml

labels:
  - pairs:
      app.jimwilleke.com/name: ngdpbase-demo
