apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngdpbase-demo
  namespace: ngdpbase-demo
  labels:
    app: ngdpbase-demo
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a single ReadWriteOnce hostPath volume cannot
  # be held by an old and a new pod at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ngdpbase-demo
  template:
    metadata:
      labels:
        app: ngdpbase-demo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: ngdpbase-demo
          # Public, throwaway demo of stock ngdpbase — no addons, no real data.
          # Unlike geohazardwatch this runs the base image directly, so it
          # tracks ngdpbase releases with no intermediate build.
          image: ghcr.io/jwilleke/ngdpbase:4.6.1 # {"$imagepolicy": "flux-system:ngdpbase-demo"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            # Seed required-pages/ on first boot instead of running the
            # interactive install wizard.
            - name: HEADLESS_INSTALL
              value: "true"
            # Must equal the PVC mountPath below — pages, users, sessions, the
            # search index and the custom config store all live under it.
            - name: INSTANCE_DATA_FOLDER
              value: "/app/data"
            # NGDPBASE_SESSION_SECRET, not SESSION_SECRET — only the six keys
            # listed in ConfigurationManager.getProperty() have env overrides,
            # and this is the name it looks for.
            - name: NGDPBASE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ngdpbase-demo-secrets
                  key: session-secret
                  optional: true
            # Consumed by the `$NGDPBASE_ADMIN_PASSWORD` env-ref in the
            # ConfigMap. The admin account is created with THIS password on
            # first boot, so a wiped demo never comes back up reachable with
            # the shipped admin/admin123 default. That matters because the
            # Cloudflare route is permanently live — after a wipe there is no
            # private window in which to change a default before the internet
            # can reach it.
            #
            # NOT optional: refusing to start is the correct behaviour when the
            # alternative is a public instance with a known password.
            - name: NGDPBASE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ngdpbase-demo-secrets
                  key: admin-password
            # Consumed by the `$NGDPBASE_SMTP_PASS` / `$NGDPBASE_MAIL_FROM`
            # env-refs in the ConfigMap above, not by any env override of their
            # own. NOT optional: an unset ref throws at startup naming the key,
            # which is the behaviour we want — magic link is the only way to
            # sign in here, so silently having no mail would leave the demo
            # permanently unauthenticatable with nothing in the logs saying why.
            - name: NGDPBASE_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ngdpbase-demo-resend
                  key: api-key
            - name: NGDPBASE_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: ngdpbase-demo-resend
                  key: from
          volumeMounts:
            - name: data
              mountPath: /app/data
            # The anchor Organization (ngdpbase#1027). Named by
            # ngdpbase.application.organization.file in the ConfigMap and read
            # from the organizations storage directory. Without it every role
            # assignment silently no-ops and nobody — including admin — has any
            # permissions. Mounted rather than written to the PVC so it survives
            # the reset in README "Resetting the demo".
            - name: config
              mountPath: /app/data/organizations/ngdpbase-demo-nerdsbythehour-com.json
              subPath: ngdpbase-demo-nerdsbythehour-com.json
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ngdpbase-demo-data
        - name: config
          configMap:
            name: ngdpbase-demo-config
            items:
              # Must be listed here as well as mounted above — an `items` list
              # projects ONLY the keys it names, so omitting this would leave
              # the subPath mount pointing at a file the volume does not carry.
              - key: ngdpbase-demo-nerdsbythehour-com.json
                path: ngdpbase-demo-nerdsbythehour-com.json
      restartPolicy: Always
