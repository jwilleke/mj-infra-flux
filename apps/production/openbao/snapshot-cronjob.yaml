# Nightly raft snapshot to the NAS (jims share), keeps the newest 14.
# Same hostPath approach as the unseal key. NFS squashes to 977:988, so the
# pod needs supplementalGroups [988]; files are chmod 0440.
# Auth is the kubernetes role raft-snapshot, created by scripts/openbao-bootstrap.sh.
# Until that role exists the Job fails. No OpenBao token is stored in the pod.
# Image tag stays in lockstep with server.image.tag in helmrelease.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: openbao
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: openbao
spec:
  schedule: "30 2 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: openbao-snapshot
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 3003
            runAsGroup: 3003
            supplementalGroups: [988]
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: quay.io/openbao/openbao:2.7.2
              env:
                - name: BAO_ADDR
                  value: http://openbao.openbao.svc.cluster.local:8200
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -ec
                - |
                  JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  BAO_TOKEN=$(bao write -field=token auth/kubernetes/login role=raft-snapshot jwt="$JWT")
                  export BAO_TOKEN
                  f=/snapshots/openbao-$(date -u +%Y%m%dT%H%M%SZ).snap
                  bao operator raft snapshot save "$f"
                  test -s "$f"
                  chmod 0440 "$f"
                  echo "saved $f ($(wc -c < "$f") bytes)"
                  ls -1 /snapshots/openbao-*.snap | sort -r | tail -n +15 | while read -r old; do rm -f "$old"; done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: snapshots
              hostPath:
                # Directory, not DirectoryOrCreate. A missing path fails the
                # Job instead of creating a root-owned folder. Create it on deby.
                path: /mnt/tank/jims/data/systems/deby/openbao/snapshots
                type: Directory
            - name: tmp
              emptyDir: {}
