# LAN and VPN only, enforced at Traefik regardless of where the name resolves.
# Depends on externalTrafficPolicy: Local so Traefik sees the real client IP
# (infrastructure/base/configs/traefik-client-ip/helmchartconfig.yaml).
# A Traefik kubernetescrd middleware ref is same-namespace only.
#
# Field is ipAllowList (Traefik 3.7 on k3s 1.36). ipWhiteList is the v2 name.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: openbao
spec:
  ipAllowList:
    sourceRange:
      - 192.168.68.0/24
      - 192.168.11.0/24
