# The Go Deployment and its Service are GONE (yourphr#675). The TypeScript stack serves this
# instance from ../yourphr-ts and has since the 2026-08-25 cut-over.
#
# pvc.yaml STAYS, deliberately and on its own: `yourphr-data` holds the Go database as it stood at
# the cut-over, and the migration never wrote to it. That volume IS the rollback — a running pod
# never was. Do not remove it without deciding, out loud, that rolling back is no longer wanted.
resources:
  - ./namespace.yaml
  - ./pvc.yaml
  - ./authentik-middleware.yaml
  - ./ingress.yaml
  - ./public-assets-ingress.yaml
  # Admin-only sandbox provider credentials, consumed by the backend's env-based sandbox seeding
  # so /sandbox connects with zero typing and the secret never reaches the browser (yourphr#291).
  - ./sandbox-credentials.sops.yaml

labels:
  - pairs:
      app.jimwilleke.com/name: yourphr
