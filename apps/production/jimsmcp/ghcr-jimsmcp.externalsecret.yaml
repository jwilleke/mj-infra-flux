# docker config JSON. OpenBao property is dockerconfigjson (no leading dot).
# The Kubernetes key must be .dockerconfigjson.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-jimsmcp
  namespace: jimsmcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ghcr-jimsmcp
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: deby/jimsmcp/ghcr-jimsmcp
        property: dockerconfigjson
