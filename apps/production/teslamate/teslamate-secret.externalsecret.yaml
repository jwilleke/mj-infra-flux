# Replaces the plaintext teslamate-secret. database-password matches
# teslamate-password in deby/database/postgresql. encryption-key is new:
# TeslaMate fields sealed with the old changeme key will not decrypt.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teslamate-secret
  namespace: teslamate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: teslamate-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deby/teslamate/teslamate-secret
