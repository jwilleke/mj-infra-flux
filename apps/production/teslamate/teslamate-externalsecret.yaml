# Values live in OpenBao at kv/apps/teslamate/teslamate (load BEFORE merging this; see PR).
# deletionPolicy Retain: an OpenBao outage never deletes the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teslamate-secret
  namespace: teslamate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: teslamate-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: apps/teslamate/teslamate
