# Replaces the plaintext postgresql-secret. Those changeme values are still
# in git history and must be rotated, not copied. scripts/openbao-bootstrap.sh
# generates new passwords and runs ALTER USER.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-secret
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: postgresql-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deby/database/postgresql
