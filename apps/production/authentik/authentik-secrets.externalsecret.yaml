# Replaces authentik-secrets.sops.yaml. HelmRelease valuesFrom still reads
# Secret authentik-secrets, keys secret_key and postgresql_password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deby/authentik/authentik-secrets
