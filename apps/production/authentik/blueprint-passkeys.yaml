# Authentik blueprint: passkey login (WebAuthn autofill on the login page).
# Mounted into the worker via helmrelease `blueprints.configMaps`; authentik
# discovers and re-applies it automatically. Only the attrs listed here are
# managed — everything else on these stages stays as configured in the UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-passkeys
  namespace: authentik
data:
  passkeys.yaml: |
    version: 1
    metadata:
      name: mj-passkeys
      labels:
        blueprints.goauthentik.io/description: "Passkey autofill on the default login flow"
    entries:
      # New WebAuthn registrations must be discoverable passkeys with user verification
      - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
        identifiers:
          name: default-authenticator-webauthn-setup
        attrs:
          user_verification: required
          resident_key_requirement: required
      # Validation stage used by the identification stage's passkey autofill
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: passkey-validation
        identifiers:
          name: passkey-validation
        attrs:
          device_classes:
            - webauthn
          not_configured_action: deny
          webauthn_user_verification: required
      # Passkey-only login flow, linked from the login page ("Use a security key")
      - model: authentik_flows.flow
        identifiers:
          slug: passkey-login
        attrs:
          name: Passkey login
          title: Sign in with a passkey
          designation: authentication
          authentication: require_unauthenticated
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !Find [authentik_flows.flow, [slug, passkey-login]]
          stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, passkey-validation]]
        attrs:
          order: 10
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !Find [authentik_flows.flow, [slug, passkey-login]]
          stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
        attrs:
          order: 100
      # Offer passkeys from the username field; password login is unchanged.
      # user_fields is restated (same as authentik's default blueprint) because the
      # serializer rejects the entry without it; !Find (not !KeyOf) so the stage
      # resolves by name during validation.
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields:
            - email
            - username
          webauthn_stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, passkey-validation]]
          passwordless_flow: !Find [authentik_flows.flow, [slug, passkey-login]]
      # Brand custom CSS — whole field is managed here (copied from the UI 2026-10-21).
      # Edit it in git; UI edits to this brand's custom CSS will be reverted.
      - model: authentik_brands.brand
        identifiers:
          domain: nerdsbythehour
        attrs:
          branding_custom_css: |
            /* SCOPED CSS - Only affects User Dashboard */

            /* 1. Force Grid Layout (Only in Library) */
            ak-library .pf-l-gallery {
                display: grid !important;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)) !important;
                gap: 1.5rem !important;
                justify-content: center !important;
            }

            ak-library .pf-l-gallery > * {
                width: auto !important;
            }

            /* 2. Style the Cards (Only in Library) */
            ak-library .pf-c-card {
                background-color: rgba(35, 35, 35, 0.85) !important;
                height: 100% !important;
                min-height: 180px !important;
                border-radius: 16px !important;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                transition: all 0.2s ease-in-out !important;

                /* Center content */
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
            }

            /* 3. Hover Effects */
            ak-library .pf-c-card:hover {
                transform: translateY(-5px) !important;
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5) !important;
                border-color: #68b0ff !important;
                z-index: 10 !important;
            }

            /* 4. Fix Icons & Text */
            ak-library .pf-c-card__title img {
                height: 80px !important;
                width: 80px !important;
                object-fit: contain !important;
                margin-bottom: 15px !important;
                display: block !important;
                margin-left: auto !important;
                margin-right: auto !important;
            }

            ak-library .pf-c-card__title-text {
                font-weight: 700 !important;
                font-size: 1.2rem !important;
                color: #ffffff !important;
                text-align: center !important;
            }

            ak-library .pf-c-card__body {
                text-align: center !important;
                color: #cccccc !important;
            }

            /* 5. Background Image (Only for User Interface Pages) */
            ak-interface-user .pf-c-page__main {
                background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop') !important;
                background-size: cover !important;
                background-position: center !important;
                background-attachment: fixed !important;
            }

            /* Dark Overlay */
            ak-interface-user .pf-c-page__main::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.6);
                z-index: 0;
            }

            ak-interface-user .pf-c-page__main-section {
                position: relative !important;
                z-index: 1 !important;
            }

            /* 6. Login page: relabel authentik's hardcoded "Use a security key" passwordless link
                  (managed in mj-infra-flux apps/production/authentik/blueprint-passkeys.yaml) */
            a[data-ouia-component-id="passwordless"] {
                font-size: 0 !important;
            }
            a[data-ouia-component-id="passwordless"]::after {
                content: "Sign in with a passkey";
                font-size: var(--pf-global--FontSize--md, 1rem);
            }
