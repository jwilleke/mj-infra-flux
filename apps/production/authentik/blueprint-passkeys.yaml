# Authentik blueprint: passkey login (WebAuthn autofill on the login page).
# Mounted into the worker via helmrelease `blueprints.configMaps`; authentik
# discovers and re-applies it automatically. Only the attrs listed here are
# managed — everything else on these stages stays as configured in the UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-passkeys
  namespace: authentik
data:
  passkeys.yaml: |
    version: 1
    metadata:
      name: mj-passkeys
      labels:
        blueprints.goauthentik.io/description: "Passkey autofill on the default login flow"
    entries:
      # New WebAuthn registrations must be discoverable passkeys with user verification
      - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
        identifiers:
          name: default-authenticator-webauthn-setup
        attrs:
          user_verification: required
          resident_key_requirement: required
      # Validation stage used by the identification stage's passkey autofill
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        id: passkey-validation
        identifiers:
          name: passkey-validation
        attrs:
          device_classes:
            - webauthn
          not_configured_action: deny
          webauthn_user_verification: required
      # Passkey-only login flow, linked from the login page ("Use a security key")
      - model: authentik_flows.flow
        identifiers:
          slug: passkey-login
        attrs:
          name: Passkey login
          title: Sign in with a passkey
          designation: authentication
          authentication: require_unauthenticated
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !Find [authentik_flows.flow, [slug, passkey-login]]
          stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, passkey-validation]]
        attrs:
          order: 10
      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !Find [authentik_flows.flow, [slug, passkey-login]]
          stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
        attrs:
          order: 100
      # Offer passkeys from the username field; password login is unchanged.
      # user_fields is restated (same as authentik's default blueprint) because the
      # serializer rejects the entry without it; !Find (not !KeyOf) so the stage
      # resolves by name during validation.
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields:
            - email
            - username
          webauthn_stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, passkey-validation]]
          passwordless_flow: !Find [authentik_flows.flow, [slug, passkey-login]]
