apiVersion: apps/v1
kind: Deployment
metadata:
  name: yourphr-ts
  namespace: yourphr
  labels:
    app: yourphr-ts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yourphr-ts
  strategy:
    type: Recreate # one SQLite writer; never two pods on one data dir
  template:
    metadata:
      labels:
        app: yourphr-ts
    spec:
      containers:
        - name: yourphr-ts
          # CI: https://github.com/jwilleke/yourphr-ts-spike/actions/workflows/docker-release.yaml
          # RELEASE-GATED, same contract as the Go image: Flux image-automation picks the highest
          # semver tag (:X.Y.Z), published only on a vX.Y.Z release tag. Pushes to main do NOT deploy.
          # The Angular UI inside is copied from the released product image the Dockerfile pins.
          # The product image again (jwilleke/yourphr#652): the TypeScript stack lives in the product
          # repository now and publishes ghcr.io/jwilleke/yourphr, built from one commit with the
          # Angular app it serves. The frozen Go image kept its own name, yourphr-go.
          # The product image (jwilleke/yourphr#652): the TypeScript stack lives in the product
          # repository now and publishes ghcr.io/jwilleke/yourphr, built from one commit with the
          # Angular app it serves. The frozen Go image kept its own name, yourphr-go.
          #
          # 3.0.1, not 3.0.0: that release crash-looped on its version read and was rolled back
          # within minutes. The image is still published and must not be deployed.
          image: ghcr.io/jwilleke/yourphr:3.16.4 # {"$imagepolicy": "flux-system:yourphr"}
          ports:
            - containerPort: 8080
              name: http
          # The SMART relay's shared secret (yourphr#870). ngdpbase's Kubernetes pattern for a secret:
          # a flat Secret bag injected with envFrom (ngdpbase docs/guides/bootstrap-developer-guide.md,
          # "How values reach each implementation"). It is the relay's own Secret — the same value the
          # relay checks on /pending — so the two can never drift and no copy of the value exists.
          # The relay ADDRESSES are settings, not secrets: Admin -> Configuration
          # (yourphr.relay.public-url, yourphr.relay.url). Env outranks <data>/.env, so do not also
          # put YOURPHR_RELAY_SECRET in the volume's .env.
          envFrom:
            - secretRef:
                name: yourphr-relay
          env:
            # BOOTSTRAP ONLY (yourphr#472). Everything that is a setting — session policy, throttle,
            # sync cadence, backup retention, trusted proxies — lives in the config store under the
            # data dir and is edited from the Admin screen; the migration tool (yourphr#586) seeds
            # it from the Go instance's custom config. The image already sets these three; they are
            # repeated here so the deployment documents where the data is, not the image.
            - name: SPIKE_STORAGE_DATA_DIR
              value: "/opt/yourphr/data"
            - name: SPIKE_WEB_STATIC_DIR
              value: "/opt/yourphr/web"
            - name: SPIKE_WEB_LISTEN_PORT
              value: "8080"
              # At-rest keys are NOT here (yourphr#796, option A, 2026-09-29): both
              # YOURPHR_DATABASE_ENCRYPTION_KEY and YOURPHR_BACKUP_ENCRYPTION_KEY live in
              # /opt/yourphr/data/.env on the PVC, read by the app at start (yourphr#630). An env
              # entry here would OUTRANK that file. Off-cluster copy: Jim's private/creds. Lose the
              # .env and the existing database will not open; a brand-new empty volume would start
              # unencrypted, so put the .env on it before the first start.
          volumeMounts:
            - name: yourphr-ts-data
              mountPath: /opt/yourphr/data
            # Same NAS archive the Go instance writes backups to (yourphr#361); the migration carries
            # backup.destination=/nas-backup, so the path must exist here too.
            - name: nas-archive
              mountPath: /nas-backup
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: yourphr-ts-data
          persistentVolumeClaim:
            claimName: yourphr-ts-data
        - name: nas-archive
          hostPath:
            path: /mnt/tank/jims/data/archive/yourphr-backup
            type: DirectoryOrCreate
