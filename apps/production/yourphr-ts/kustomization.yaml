# The TypeScript stack that succeeds the Go backend (yourphr#544 transition; yourphr#587 deploy).
# Same namespace as yourphr, its OWN PVC and Service, and deliberately NO Ingress: the cut-over
# (yourphr#588) is the Ingress backend moving from `yourphr` to `yourphr-ts`, and rollback is
# moving it back. Until then this runs alongside Go, reachable only in-cluster.
resources:
  - ./pvc.yaml
  - ./deployment.yaml
  - ./service.yaml

labels:
  - pairs:
      app.jimwilleke.com/name: yourphr-ts
