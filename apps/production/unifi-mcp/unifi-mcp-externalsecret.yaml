# Values live in OpenBao at kv/apps/unifi-mcp/unifi-mcp (KV v2, mount `kv`).
# Load them BEFORE merging this; see README.md "Secrets".
# Keys: username, password, api-key (optional), mcp-auth-token.
# deletionPolicy Retain: an OpenBao outage never deletes the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
  namespace: unifi-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: unifi-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: apps/unifi-mcp/unifi-mcp
