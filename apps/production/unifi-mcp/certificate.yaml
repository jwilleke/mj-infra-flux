# DNS-01 via letsencrypt-production. No public A record is required.
# The hostname still appears in certificate transparency logs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: unifi-mcp-tls
  namespace: unifi-mcp
spec:
  secretName: unifi-mcp-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - unifi-mcp.nerdsbythehour.com
