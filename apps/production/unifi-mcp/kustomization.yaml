apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unifi-mcp
resources:
  - namespace.yaml
  - unifi-mcp-externalsecret.yaml  # username/password/api-key/mcp-auth-token, from OpenBao kv/apps/unifi-mcp/unifi-mcp
  - deployment.yaml
  - service.yaml
  - middleware-lan-only.yaml
  - certificate.yaml
  - ingressroute.yaml

# Image automation lives in apps/production/image-automation/unifi-mcp-policy.yaml.
