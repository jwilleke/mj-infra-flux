# Copy of apps/production/openbao/middleware-lan-only.yaml: a Traefik
# kubernetescrd middleware ref is same-namespace only. LAN and VPN only,
# enforced at Traefik regardless of where the name resolves (relies on
# externalTrafficPolicy: Local for the real client IP).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: unifi-mcp
spec:
  ipAllowList:
    sourceRange:
      - 192.168.68.0/24
      - 192.168.11.0/24
