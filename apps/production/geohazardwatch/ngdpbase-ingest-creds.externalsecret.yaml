# The kustomization namespace transform places this in geohazardwatch.
# The jimsmcp copy of the old SOPS file was not referenced and is removed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ngdpbase-ingest-creds
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ngdpbase-ingest-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deby/geohazardwatch/ngdpbase-ingest-creds
