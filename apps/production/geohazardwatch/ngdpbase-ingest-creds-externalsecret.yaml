# Values live in OpenBao at kv/apps/geohazardwatch/ngdpbase-ingest-creds (load BEFORE merging this; see PR).
# deletionPolicy Retain: an OpenBao outage never deletes the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ngdpbase-ingest-creds
  namespace: geohazardwatch
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ngdpbase-ingest-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: apps/geohazardwatch/ngdpbase-ingest-creds
