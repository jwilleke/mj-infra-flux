apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: geohazardwatch
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # Certificate auto-created by ingress annotation
  - cronjob-import.yaml
  # ngdpbase-ingest-creds comes from OpenBao. The namespace transform below
  # places the ExternalSecret in geohazardwatch.
  - ngdpbase-ingest-creds.externalsecret.yaml

# Image automation (ImageRepository / ImagePolicy / ImageUpdateAutomation)
# lives in apps/production/image-automation/ — those resources are in the
# flux-system namespace and would be rewritten to `geohazardwatch` if listed
# here (the top-level `namespace:` above overrides per-resource values).
