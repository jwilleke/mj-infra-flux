apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: geohazardwatch
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # Certificate auto-created by ingress annotation
  # cronjob-import.yaml removed (ngdpbase#2056): the add-on refreshes its data
  # as core scheduled jobs (geohazardwatch.import-*), ngdpbase#2054.
  # ngdpbase-ingest-creds: copied from apps/production/jimsmcp/ (mj-infra-flux#124);
  # the top-level `namespace:` transform re-homes it from jimsmcp to geohazardwatch
  - ngdpbase-ingest-creds.sops.yaml

# Image automation (ImageRepository / ImagePolicy / ImageUpdateAutomation)
# lives in apps/production/image-automation/ — those resources are in the
# flux-system namespace and would be rewritten to `geohazardwatch` if listed
# here (the top-level `namespace:` above overrides per-resource values).
