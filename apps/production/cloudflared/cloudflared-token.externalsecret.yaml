# Replaces secretGenerator on .env.secret.cloudflared.encrypted.
# Key TUNNEL_TOKEN, stable name cloudflared-token (no hash suffix).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflared-token
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deby/cloudflared/cloudflared-token
