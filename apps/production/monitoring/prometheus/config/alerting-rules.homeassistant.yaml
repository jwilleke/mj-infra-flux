groups:
  - name: homeassistant
    interval: 1m
    rules:
      # Home Assistant unreachable or /api/prometheus failing.
      # 10m rather than 5m: HA restarts take the endpoint down for ~1-2 min and
      # a routine restart should not page.
      - alert: HomeAssistantScrapeDown
        expr: up{job="homeassistant"} == 0
        for: 10m
        labels:
          severity: critical
          host: hapi
          source: homeassistant
        annotations:
          summary: "Home Assistant metrics scrape is down"
          description: |
            Prometheus cannot reach Home Assistant /api/prometheus at
            192.168.68.20:8123. HA may be down, restarting, or the long-lived
            access token may have been revoked (401 rather than a connection
            error). The house keeps running automations either way — this is
            loss of visibility, not loss of function.
            Check: ssh 192.168.68.20 'ha core info'
            Token check: curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              http://192.168.68.20:8123/api/prometheus

      # A safety-relevant entity's DEVICE has stopped reporting.
      #
      # Supersedes HomeAssistantSafetyEntityStale, which watched last_updated on
      # the door contacts themselves and was a false positive by construction.
      # HA's last_updated only advances when state or attributes CHANGE, so a
      # closed door that stays closed never updates however healthy the sensor
      # is. Every exterior door trivially passed 6h overnight. Verified
      # 2026-08-21: four contacts alerting, all four devices demonstrably alive
      # (ds_garage_man linkquality 0.2h old, ds_front_door battery 0.6h,
      # garage_all_in_one uptime 0.0h). See #182.
      #
      # CORRECTION 2026-08-23 (#189): the original rule's reasoning, preserved
      # below, rested on a false premise. It rejected hass_entity_available
      # because "that reads 1 for `unknown`". It does not. From the live
      # endpoint on HA 2026.8.2:
      #   # HELP hass_entity_available Entity is available (not in the
      #   #      unavailable or unknown state)
      # The gauge is 0 for BOTH `unavailable` and `unknown`, so signal 1 does
      # not hand out a false all-clear when a dead device flips to `unknown`
      # across an HA restart (the patio bulbs, mjs-ha#69).
      #
      # Both signals are still used, but signal 2 earns its place for a
      # different reason than the one recorded here: it covers the case no
      # availability gauge can see, a device that stops reporting while its
      # entity holds a plausible last value. Availability alone is not enough,
      # and staleness alone cries wolf.

      # Signal 1 — the integration says the device is gone.
      # Zigbee2MQTT availability is enabled (active 10m, passive 1500m) and
      # ESPHome marks entities unavailable on API disconnect, so this is a real
      # verdict from the integration rather than an inference.
      - alert: HomeAssistantSafetyEntityUnavailable
        expr: |
          hass_entity_available{entity=~"alarm_control_panel\\.alarmo|binary_sensor\\.(ds_front_door_contact|patio_door_contact|ds_garage_man_contact|office_stairs_door_contact|garage_all_in_one_garage_door_closed_switch)"} == 0
        for: 15m
        labels:
          severity: critical
          host: hapi
          source: homeassistant
        annotations:
          summary: "HA safety entity {{ $labels.entity }} is unavailable"
          description: |
            {{ $labels.entity }} ({{ $labels.friendly_name }}) is reported
            unavailable. These are the alarm panel and the door contacts it arms
            on — an unavailable one means the alarm may be arming over a sensor
            that cannot report an opening.
            Check the device battery and mesh first (Zigbee / ESPHome), then
            .storage/core.restore_state for the last known value.

      # Signal 2 — the device's own heartbeat stopped.
      # Catches the case signal 1 cannot see: a device that stopped reporting
      # while its entity still holds a plausible last value, so availability
      # stays 1 — a closed door reading `off` forever. These heartbeat
      # entities carry values that drift on their own (device temperature, link
      # quality, uptime), so unlike a door contact they update whether or not
      # anyone touches the door — and staleness on them cannot be faked.
      #
      # 24h, not 6h: the slowest observed heartbeat is
      # office_stairs_door_device_temperature at ~10h, and Zigbee2MQTT's own
      # passive availability timeout is 25h. A battery contact cannot be
      # declared dead faster than it reports; a shorter window would only
      # reintroduce false positives.
      - alert: HomeAssistantSafetyDeviceHeartbeatStale
        expr: |
          (time() - hass_last_updated_time_seconds{entity=~"sensor\\.(ds_front_door_device_temperature|patio_door_device_temperature|ds_garage_man_linkquality|office_stairs_door_device_temperature|garage_all_in_one_system_uptime)"}) > 86400
        for: 30m
        labels:
          severity: critical
          host: hapi
          source: homeassistant
        annotations:
          summary: "HA safety device heartbeat {{ $labels.entity }} stale for over 24h"
          description: |
            {{ $labels.entity }} ({{ $labels.friendly_name }}) has not reported
            in over 24 hours. This is the liveness heartbeat for one of the
            devices behind the alarm's door contacts, so the contact itself is
            probably not reporting either — even if it still reads a plausible
            state.
            Check the device battery and mesh (Zigbee / ESPHome). If the device
            is fine, confirm this entity still exists and was not renamed: a
            heartbeat entity that vanishes silently disables this alert.

      # Bulk entity health. The baseline is high and mostly dashboard cruft, so
      # this is a change detector, not a correctness check.
      #
      # 170 of 1080 entities read unavailable on 2026-08-18. Threshold 200 gives
      # headroom for churn while still catching an integration dropping wholesale
      # (a Z-Wave stick falling off, Zigbee2MQTT stopping). Revisit the number if
      # the baseline moves; a permanently-firing alert gets ignored, which is
      # worse than no alert.
      #
      # 2026-08-23 (#189): the Tesla is excluded, because the Tesla WAS the
      # alert. Every sustained excursion in retention was one parked car —
      # 08-20 11:01-17:31 UTC peak 222, and 08-21 20:06 to 08-22 01:06 UTC peak
      # 209. Diffing hass_entity_available == 0 between quiet and peak returns
      # 40 newly-zero entities, 38 of them tesla_fleet `blue_moon_*`.
      # tesla_fleet marks a sleeping vehicle unavailable, which is correct
      # behaviour: one sleep is worth ~40 against only 30 of headroom between
      # the 170 baseline and the 200 threshold, and the car slept in 10% of
      # samples over five days. The rule was guaranteed to fire on an expected
      # event, which is the exact failure the paragraph above warns about.
      #
      # Excluding it, the same five-day window runs 157-171 (p95 166), so 200 is
      # real headroom rather than a coin flip. The cost is a blind spot: this no
      # longer notices tesla_fleet or the TeslaMate MQTT entities dropping. A
      # dedicated vehicle-offline rule is the right cover for that, not widening
      # this one back out.
      - alert: HomeAssistantUnavailableEntitiesHigh
        expr: |
          count(hass_entity_available{entity!~".*\\.blue_moon_.*"} == 0) > 200
        for: 1h
        labels:
          severity: warning
          host: hapi
          source: homeassistant
        annotations:
          summary: "Home Assistant: {{ $value }} entities not reporting"
          description: |
            {{ $value }} entities are not reporting, against a 2026-08-18
            baseline of 170 (157-171 excluding the Tesla, measured 2026-08-23).
            A jump usually means a whole integration is down rather than
            individual devices.
            Break it down by domain first — the bare list is ~170 rows:
              count by (domain) (hass_entity_available == 0)
            Then list them:
              hass_entity_available == 0
            This counts BOTH `unavailable` and `unknown`: the gauge is 0 for
            either, per its own HELP text ("not in the unavailable or unknown
            state"). Roughly a third of the standing baseline is `unknown`, so
            do not read the count as a device-unreachable tally. Vehicle
            entities are excluded — see the comment on the rule.
