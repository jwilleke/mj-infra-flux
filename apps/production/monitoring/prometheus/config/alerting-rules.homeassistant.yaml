groups:
  - name: homeassistant
    interval: 1m
    rules:
      # Home Assistant unreachable or /api/prometheus failing.
      # 10m rather than 5m: HA restarts take the endpoint down for ~1-2 min and
      # a routine restart should not page.
      - alert: HomeAssistantScrapeDown
        expr: up{job="homeassistant"} == 0
        for: 10m
        labels:
          severity: critical
          host: hapi
          source: homeassistant
        annotations:
          summary: "Home Assistant metrics scrape is down"
          description: |
            Prometheus cannot reach Home Assistant /api/prometheus at
            192.168.68.20:8123. HA may be down, restarting, or the long-lived
            access token may have been revoked (401 rather than a connection
            error). The house keeps running automations either way — this is
            loss of visibility, not loss of function.
            Check: ssh 192.168.68.20 'ha core info'
            Token check: curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              http://192.168.68.20:8123/api/prometheus

      # Home Assistant's own alarm panel has gone.
      #
      # This file used to carry two per-device rules as well: door contacts
      # unavailable (HomeAssistantSafetyEntityUnavailable) and a stale device
      # heartbeat (HomeAssistantSafetyDeviceHeartbeatStale). Both were removed
      # 2026-09-16 (mjs-ha#92). Dead devices are now caught INSIDE Home
      # Assistant by one routine, templates/template_silent_devices.yaml in
      # mjs-ha, which watches 41 devices (every enabled Alarmo sensor among
      # them) by last_seen, Z-Wave node status or availability, and pushes and
      # Telegrams. The Prometheus copies watched five doors, used different
      # limits, and false-fired on office_stairs_door_device_temperature.
      #
      # What stays here is what Home Assistant cannot report about itself: the
      # scrape being down (HA gone), an integration dropping wholesale, and
      # this: the Alarmo panel entity itself unavailable, which the silent
      # devices routine does not watch.
      - alert: HomeAssistantAlarmPanelUnavailable
        expr: |
          hass_entity_available{entity="alarm_control_panel.alarmo"} == 0
        for: 15m
        labels:
          severity: critical
          host: hapi
          source: homeassistant
        annotations:
          summary: "Home Assistant alarm panel is unavailable"
          description: |
            alarm_control_panel.alarmo has been unavailable or unknown for 15
            minutes while Home Assistant itself is up. The alarm cannot arm,
            disarm or trigger.
            Check: ssh 192.168.68.20 'ha core logs' for alarmo errors, and
            whether custom_components/alarmo loaded.

      # Bulk entity health. The baseline is high and mostly dashboard cruft, so
      # this is a change detector, not a correctness check.
      #
      # 170 of 1080 entities read unavailable on 2026-08-18. Threshold 200 gives
      # headroom for churn while still catching an integration dropping wholesale
      # (a Z-Wave stick falling off, Zigbee2MQTT stopping). Revisit the number if
      # the baseline moves; a permanently-firing alert gets ignored, which is
      # worse than no alert.
      #
      # 2026-08-23 (#189): the Tesla is excluded, because the Tesla WAS the
      # alert. Every sustained excursion in retention was one parked car —
      # 08-20 11:01-17:31 UTC peak 222, and 08-21 20:06 to 08-22 01:06 UTC peak
      # 209. Diffing hass_entity_available == 0 between quiet and peak returns
      # 40 newly-zero entities, 38 of them tesla_fleet `blue_moon_*`.
      # tesla_fleet marks a sleeping vehicle unavailable, which is correct
      # behaviour: one sleep is worth ~40 against only 30 of headroom between
      # the 170 baseline and the 200 threshold, and the car slept in 10% of
      # samples over five days. The rule was guaranteed to fire on an expected
      # event, which is the exact failure the paragraph above warns about.
      #
      # Excluding it, the same five-day window runs 157-171 (p95 166), so 200 is
      # real headroom rather than a coin flip. The cost is a blind spot: this no
      # longer notices tesla_fleet or the TeslaMate MQTT entities dropping. A
      # dedicated vehicle-offline rule is the right cover for that, not widening
      # this one back out.
      - alert: HomeAssistantUnavailableEntitiesHigh
        expr: |
          count(hass_entity_available{entity!~".*\\.blue_moon_.*"} == 0) > 200
        for: 1h
        labels:
          severity: warning
          host: hapi
          source: homeassistant
        annotations:
          summary: "Home Assistant: {{ $value }} entities not reporting"
          description: |
            {{ $value }} entities are not reporting, against a 2026-08-18
            baseline of 170 (157-171 excluding the Tesla, measured 2026-08-23).
            A jump usually means a whole integration is down rather than
            individual devices.
            Break it down by domain first — the bare list is ~170 rows:
              count by (domain) (hass_entity_available == 0)
            Then list them:
              hass_entity_available == 0
            This counts BOTH `unavailable` and `unknown`: the gauge is 0 for
            either, per its own HELP text ("not in the unavailable or unknown
            state"). Roughly a third of the standing baseline is `unknown`, so
            do not read the count as a device-unreachable tally. Vehicle
            entities are excluded — see the comment on the rule.
