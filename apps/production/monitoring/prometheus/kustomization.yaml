resources:
  - ./authorize-prometheus-to-k8s.yaml
  # netalertx-api-token Secret applied out-of-band via kubectl (not in git)
  # kubectl create secret generic netalertx-api-token -n monitoring --from-literal=token=<API_TOKEN>
  # homeassistant-api-token Secret likewise out-of-band (mjs-ha#72). Value is a
  # Home Assistant long-lived access token from the HA UI (profile > Security).
  # kubectl create secret generic homeassistant-api-token -n monitoring --from-file=token=/dev/stdin
  - ./prometheus-statefulset.yaml
  - ./prometheus-service.yaml
  - ./prometheus-pdb.yaml
  # Certificate handled by ingress annotation instead of separate resource
  # - ./certificate.yaml
  - ./prometheus-ingress.yaml
  - ./authentik-middleware.yaml

# prometheus-secrets removed: prometheus switched from basic auth to Authentik
# ForwardAuth (web.yaml removed below); the encrypted env file held unused
# prom_srape_username/password and a stale age recipient. See AGENTS.md "Tech Debt".

# kustomize help on configMapGenerator: https://kubectl.docs.kubernetes.io/references/kustomize/builtins/#_configmapgenerator_
configMapGenerator:
  - name: prometheus-config
    files:
      - config/prometheus.yaml
      # web.yaml removed - using Authentik ForwardAuth instead of basic auth
      # scrape configs:
      - config/scrape-configs.prometheus.yaml
      - config/scrape-configs.blackbox.yaml
      # monitoring and alerting rules:
      - config/alerting-rules.prometheus.yaml
      - config/alerting-rules.service-health.yaml
      - config/alerting-rules.k3s-cluster.yaml
      # Alertmanager's own delivery-health self-monitoring (mj-infra-flux#136)
      - config/alerting-rules.alertmanager.yaml
      # Loki-independent storage/backup alerts (mj-infra-flux#74)
      - config/alerting-rules.storage-backup.yaml
      # nas-backup-rsync monitoring backstop, independent of its GitHub-issue alerting path (deby#50)
      - config/alerting-rules.nas-backup-rsync.yaml
      # Loki-independent Docker container liveness alerts (mj-infra-flux#76)
      - config/alerting-rules.docker.yaml
      # NetAlertX /metrics scrape + alert rules (deby#27)
      - config/scrape-configs.netalertx.yaml
      - config/alerting-rules.netalertx.yaml
      # YourPHR SMART relay /metrics scrape + alert rules (yourphr#50)
      - config/scrape-configs.yourphr-relay.yaml
      - config/alerting-rules.yourphr-relay.yaml
      # Home Assistant /api/prometheus scrape + alert rules (mjs-ha#72)
      - config/scrape-configs.homeassistant.yaml
      - config/alerting-rules.homeassistant.yaml
      # coinpoet and tayle configs removed

labels:
  - pairs:
      # use `app.jimwilleke.com/name` to avoid conflicts with other people's resources using "app" label.
      app.jimwilleke.com/name: prometheus
      # NOTE: tenet is specified in the overlays
      #app.jimwilleke.com/tenant:
