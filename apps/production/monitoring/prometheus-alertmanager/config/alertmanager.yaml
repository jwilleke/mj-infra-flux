global:
  # ResolveTimeout is the default value used by alertmanager if the alert does
  # not include EndsAt, after this time passes it can declare the alert as resolved if it has not been updated.
  # This has no impact on alerts from Prometheus, as they always include EndsAt.
  # default = 5m
  resolve_timeout: 5m
  # Resend SMTP relay (port 587/STARTTLS — Alertmanager's SMTP client doesn't
  # support implicit TLS on 465). Sends from nerdsbythehour.com, already a
  # verified Resend domain (see send.nerdsbythehour.com / resend._domainkey
  # DNS records).
  smtp_smarthost: 'smtp.resend.com:587'
  smtp_from: 'alerts@nerdsbythehour.com'
  smtp_auth_username: 'resend'
  smtp_auth_password_file: '/config/secrets/resend_api_key'
  smtp_require_tls: true

# Both files land in /config via the alertmanager-config configMap.
templates:
  - '/config/*.tmpl'

route:
  # The (default) notification destination
  receiver: "on_call_operator_default"
  # The labels by which incoming alerts are grouped together.
  group_by: ["alertname"]
  # How long to initially wait to send a notification for a group
  # of alerts. Allows to wait for an inhibiting alert to arrive or collect
  # more initial alerts for the same group.
  group_wait: 30s
  # How long to wait before sending a notification about new alerts that
  # are added to a group of alerts for which an initial notification has
  # already been sent. (Usually ~5m or more.)
  group_interval: 5m
  # How long to wait before sending a notification again if it has already been sent successfully for an alert.
  repeat_interval: 4h

  routes:
    # Weekly maintenance window (deby#69; schedule in jwilleke/homelab
    # docs/maintenance/maintenance-window.md; silences runbook in
    # apps/production/monitoring/README.md#maintenance-window):
    # severity=warning notifications are held from Sat 22:00 to Sun 02:00
    # America/New_York. Alerts still fire and show in Grafana and the
    # Alertmanager UI; a warning that is still firing when the window closes
    # is notified at the next group_interval after 02:00. critical and info
    # alerts do not match this route and keep notifying through the root
    # route. For a planned reboot that would trip a critical alert, add a
    # scoped silence first (see the README section).
    - matchers:
        - severity="warning"
      receiver: "on_call_operator_default"
      mute_time_intervals:
        - weekly-maintenance-window

    # severity=info: Don't send the follow-up resolved notification.
    #- match:
    #    severity: info
    #  continue: false
    #  # The notification destination
    #  receiver: "on_call_operator_no_resolved"
    # all other alerts get sent notifications for the initial firing _and_ resolved notifications.

    #match: We want this to match all alerts (severity=info is first though so it will stop)

# Sat 22:00 -> Sun 02:00 America/New_York (deby#69). The window crosses
# midnight, so it is two ranges (end_time "24:00" is allowed). location makes
# DST automatic: the window stays at local 22:00-02:00 in both EST and EDT.
# On the November fall-back night 01:00-02:00 happens twice, so the window is
# one hour longer; on the March spring-forward night local 02:00 does not
# exist, so the window ends at 03:00 EDT, which is the same instant.
time_intervals:
  - name: weekly-maintenance-window
    time_intervals:
      - weekdays: ["saturday"]
        times:
          - start_time: "22:00"
            end_time: "24:00"
        location: "America/New_York"
      - weekdays: ["sunday"]
        times:
          - start_time: "00:00"
            end_time: "02:00"
        location: "America/New_York"

inhibit_rules:
  # Inhibit rules mute a new alert (target) that matches an existing alert (source).
  - source_match:
      # if the existing alert (source) is severity=critical
      severity: "critical"
    target_match:
      # and the new alert (target) is severity=warning
      severity: "warning"
      # and the alertname, job, and instance labels have the same value
    equal: ["alertname", "job", "instance"]

receivers:
  - name: "on_call_operator_default"
    email_configs:
      - to: 'mjsservers@willeke.com'
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
