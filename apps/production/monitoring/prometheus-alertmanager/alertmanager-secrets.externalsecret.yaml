# Replaces secretGenerator on .env.secret.alertmanager.encrypted.
# The Deployment mounts this Secret by the stable name alertmanager-secrets.
# Key today: resend_api_key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deby/monitoring/alertmanager-secrets
