# Values live in OpenBao at kv/apps/monitoring/alertmanager-secrets (load BEFORE merging this; see PR).
# deletionPolicy Retain: an OpenBao outage never deletes the Secret.
# Fixed name (no kustomize hash): after changing the value, run
#   kubectl -n monitoring rollout restart deployment/alertmanager
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: apps/monitoring/alertmanager-secrets
