apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app: alertmanager
spec:
  replicas: 1
  # RWO data volume + single replica: stop the old pod before starting the new one.
  strategy:
    type: Recreate
    # Explicit null: server-side apply otherwise keeps the live default
    # rollingUpdate block, which is invalid with Recreate.
    rollingUpdate: null

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      securityContext:
        fsGroup: 65534  # image runs as nobody; make the data volume writable
      containers:
        - name: alertmanager
          # image tags at https://quay.io/repository/prometheus/alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          args:
            - "--config.file=/config/alertmanager.yaml"
            - "--web.external-url=https://grafana.nerdsbythehour.com/alerting/list"
            - "--storage.path=/alertmanager"

          ports:
            - name: api
              containerPort: 9093

          resources:
            limits:
              cpu: "1.0"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "250Mi"

          volumeMounts:
            - name: alertmanager-config-volume
              mountPath: /config

            - name: alertmanager-secrets
              mountPath: /config/secrets

            - name: alertmanager-data
              mountPath: /alertmanager

      volumes:
        # populated by configMapGenerator in kustomization.yaml
        - name: alertmanager-config-volume
          configMap:
            defaultMode: 420
            name: alertmanager-config
        # populated by secretGenerator in kustomization.yaml
        - name: alertmanager-secrets
          secret:
            secretName: alertmanager-secrets
        # silences + notification log (mj-infra-flux#238)
        - name: alertmanager-data
          persistentVolumeClaim:
            claimName: alertmanager-data
