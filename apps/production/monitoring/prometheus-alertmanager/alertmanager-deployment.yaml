apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app: alertmanager
spec:
  replicas: 1
  # RWO data volume + single replica: stop the old pod before starting the new one.
  strategy:
    type: Recreate
    # Explicit null: server-side apply otherwise keeps the live default
    # rollingUpdate block, which is invalid with Recreate.
    rollingUpdate: null
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534 # image runs as nobody; make the data volume writable
      containers:
        - name: alertmanager
          # image tags at https://quay.io/repository/prometheus/alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b # {"$imagepolicy": "flux-system:alertmanager"}
          args:
            - "--config.file=/config/alertmanager.yaml"
            - "--web.external-url=https://grafana.nerdsbythehour.com/alerting/list"
            - "--storage.path=/alertmanager"
            # Keep the notification log for 8 days so the 7d repeat_interval on
            # maintenance="deferred" alerts holds (default retention is 120h).
            - "--data.retention=192h"
          ports:
            - name: api
              containerPort: 9093
          resources:
            limits:
              cpu: "1.0"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "250Mi"
          volumeMounts:
            - name: alertmanager-config-volume
              mountPath: /config
            - name: alertmanager-secrets
              mountPath: /config/secrets
            - name: alertmanager-data
              mountPath: /alertmanager
      volumes:
        # populated by configMapGenerator in kustomization.yaml
        - name: alertmanager-config-volume
          configMap:
            defaultMode: 420
            name: alertmanager-config
        # populated by secretGenerator in kustomization.yaml
        - name: alertmanager-secrets
          secret:
            secretName: alertmanager-secrets
        # silences + notification log (mj-infra-flux#238)
        - name: alertmanager-data
          persistentVolumeClaim:
            claimName: alertmanager-data
