apiVersion: v1
kind: ServiceAccount
metadata:
  name: briefing-status
---
# Least privilege: read and patch only the briefing-status ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: briefing-status
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["briefing-status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: briefing-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: briefing-status
subjects:
  - kind: ServiceAccount
    name: briefing-status
