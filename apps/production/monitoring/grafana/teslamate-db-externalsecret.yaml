# TeslaMate DB password for Grafana's provisioned TeslaMate datasource.
# Source: OpenBao kv/apps/teslamate/teslamate, key database-password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-teslamate-db
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-teslamate-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TESLAMATE_DB_PASSWORD
      remoteRef:
        key: apps/teslamate/teslamate
        property: database-password
