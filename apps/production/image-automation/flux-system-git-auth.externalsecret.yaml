# Replaces flux-system-git-auth.sops.yaml. gotk-sync.yaml still references
# this Secret by name. The repo is public, so a short gap hurts image
# automation pushes, not anonymous fetches. deletionPolicy Retain keeps the
# last good Secret if OpenBao blips after the first sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-system-git-auth
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: flux-system-git-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deby/flux-system/flux-system-git-auth
