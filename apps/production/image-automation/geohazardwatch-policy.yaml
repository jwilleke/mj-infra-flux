apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  # geohazardwatch.com runs the stock ngdpbase image; the geohazardwatch
  # add-on is installed by core's installer from the site's configuration
  # (ngdpbase#2056). Modelled on ngdpbase-demo-policy.yaml. New names rather
  # than repointing the old `geohazardwatch` objects, so a stale latestRef from
  # the retired ghcr.io/jwilleke/geohazardwatch repository can never be
  # written back into deployment.yaml while the new one is first scanned.
  name: geohazardwatch-ngdpbase
  namespace: flux-system
spec:
  image: ghcr.io/jwilleke/ngdpbase
  interval: 10m
  # GHCR package is PUBLIC — scanned anonymously, no pull secret needed.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: geohazardwatch-ngdpbase
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: geohazardwatch-ngdpbase
  policy:
    semver:
      # Auto-update minor and patch within the current major, from the core
      # release the switch was made on. A major bump requires widening this
      # range by hand.
      range: ">=5.32.0 <6.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: geohazardwatch-ngdpbase
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore(image-automation): bump geohazardwatch to {{range .Changed.Changes}}{{.NewValue}} {{end}}
    push:
      branch: master
  update:
    # Scans the app dir for the
    # `# {"$imagepolicy": "flux-system:geohazardwatch-ngdpbase"}` marker.
    # Scoped to this directory so it never touches ngdpbase-demo, which
    # follows the same image with its own policy.
    path: ./apps/production/geohazardwatch
    strategy: Setters
