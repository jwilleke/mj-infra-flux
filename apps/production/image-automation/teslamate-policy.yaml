# TeslaMate (deby#69, follows up mj-infra-flux#234). Patch-only: minors can
# carry DB migrations, so widen by hand after reading the changelog.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: teslamate
  namespace: flux-system
spec:
  # Exactly as written in the manifest, so the setter rewrites only tag@digest.
  image: teslamate/teslamate
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: teslamate
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: teslamate
  digestReflectionPolicy: IfNotPresent
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=4.3.0 <4.4.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: teslamate
  namespace: flux-system
spec:
  interval: 6h
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        chore(image-automation): bump teslamate images {{range .Changed.Changes}}{{.NewValue}} {{end}}
    push:
      branch: master
  update:
    # Scans the dir for `# {"$imagepolicy": "flux-system:<name>"}` markers.
    path: ./apps/production/teslamate
    strategy: Setters
