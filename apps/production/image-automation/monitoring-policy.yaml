# Monitoring stack images (deby#69): Prometheus, Alertmanager, blackbox,
# node-exporter, Loki, Grafana, OTel Collector. Patch-only within the running
# minor; widen a range by hand after reading release notes. These were
# digest-pinned by hand (mj-infra-flux#234); digestReflectionPolicy keeps
# each bump pinned as tag@digest.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: prometheus
  namespace: flux-system
spec:
  # Exactly as written in the manifest, so the setter rewrites only tag@digest.
  image: prom/prometheus
  interval: 6h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: prometheus
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: prometheus
  digestReflectionPolicy: IfNotPresent
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=3.15.0 <3.16.0"
---
