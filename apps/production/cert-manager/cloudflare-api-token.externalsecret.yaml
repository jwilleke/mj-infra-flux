# Replaces cloudflare-api-token.sops.yaml.
# This token is for the existing Let's Encrypt ClusterIssuers (other hosts).
# stuff.nerdsbythehour.com does not use it. OpenBao's leaf comes from
# ClusterIssuer deby-internal-ca.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: deby/cert-manager/cloudflare-api-token
        property: api-token
