# Becomes Ready only after scripts/openbao-bootstrap.sh has enabled
# kubernetes auth and the external-secrets role. Until then the store
# is NotReady. The Flux Kustomization that applies this file uses
# wait: false, and apps does not depend on it.
#
# Future ExternalSecrets point here and set deletionPolicy: Retain.
# This file does not create any ExternalSecret. SOPS stays.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
