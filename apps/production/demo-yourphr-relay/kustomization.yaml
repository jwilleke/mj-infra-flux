apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Demo instance of the YourPHR SMART OAuth store-and-poll relay — mirrors
# apps/production/yourphr-relay. Deploys into the existing `demo-yourphr` namespace (owned by
# ../demo-yourphr/namespace.yaml — not redeclared here). docs/demo-yourphr-org/implementation-plan.md
# (mj-infra-flux#147).
resources:
  - ./deployment.yaml
  - ./service.yaml
  # Public exposure is via the Cloudflare Tunnel (dashboard-managed), NOT a Traefik
  # ingress — same as the ops relay. See ../yourphr-relay/README.md.
  - ./relay-secret.sops.yaml

labels:
  - pairs:
      app.jimwilleke.com/name: demo-yourphr-relay
