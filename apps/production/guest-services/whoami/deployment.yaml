apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: guest-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      securityContext:
        runAsUser: 3003
        runAsGroup: 3003
        fsGroup: 3003
      containers:
      - name: whoami
        image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44  # pinned to the digest running 2026-10-14 (#234); upgrade deliberately
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
