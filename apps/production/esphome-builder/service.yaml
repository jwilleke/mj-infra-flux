# Backs the ingress only. LAN clients (HA add-on, MCP) hit 192.168.68.71:6052/6055
# directly via hostNetwork.
apiVersion: v1
kind: Service
metadata:
  name: esphome-builder
  namespace: esphome-builder
  labels:
    app: esphome-builder
spec:
  type: ClusterIP
  selector:
    app: esphome-builder
  ports:
    - name: http
      port: 6052
      targetPort: 6052
      protocol: TCP
