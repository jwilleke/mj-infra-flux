apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: esphome-builder
resources:
  - namespace.yaml
  - esphome-builder-auth.sops.yaml  # ESPHOME_USERNAME/PASSWORD for the 6052 dashboard (decrypted by the apps Kustomization)
  - deployment.yaml
  - service.yaml
  - authentik-middleware.yaml
  - ingress.yaml

# Image automation lives in apps/production/image-automation/esphome-builder-policy.yaml.
