# Values live in OpenBao at kv/apps/esphome-builder/esphome-builder-auth (load BEFORE merging this; see PR).
# Keys: username, password. deletionPolicy Retain: an OpenBao outage never deletes the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome-builder-auth
  namespace: esphome-builder
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: esphome-builder-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: apps/esphome-builder/esphome-builder-auth
