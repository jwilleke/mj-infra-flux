# Values live in OpenBao at kv/apps/maps/maps-secret (load BEFORE merging this; see PR).
# deletionPolicy Retain: an OpenBao outage never deletes the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maps-secret
  namespace: maps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: maps-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: apps/maps/maps-secret
