# ESO logs in with its own ServiceAccount token (kubernetes auth role
# external-secrets). Policy external-secrets-read allows kv/data/deby/* only.
# That role is created by scripts/openbao-bootstrap.sh, not by this file.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
