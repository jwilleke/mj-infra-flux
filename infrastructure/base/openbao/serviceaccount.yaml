apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: openbao
---
# Lets OpenBao call the TokenReview API for its kubernetes auth method.
# ESO and the snapshot CronJob log in with their ServiceAccount tokens.
# No static OpenBao token is stored.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
