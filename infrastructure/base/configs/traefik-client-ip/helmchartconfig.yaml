---
# Traefik is installed by k3s' bundled Helm controller, so it is customised
# through a HelmChartConfig rather than a HelmRelease. This object previously
# existed in-cluster as a hand-applied `kubectl apply`; it is declared here so
# Flux owns it and the values survive a rebuild.
#
# `service.spec.externalTrafficPolicy: Local` is the reason this file exists.
# With the default `Cluster`, k3s ServiceLB (klipper-lb) SNATs inbound traffic,
# so Traefik sees every client as the pod-network gateway 10.42.0.1 and stamps
# that into X-Forwarded-For. Downstream origins then have no way to learn who
# actually connected. `Local` skips the SNAT and preserves the source address.
#
# Safe here because deby is a single-node cluster: `Local` only serves traffic
# on nodes running a Traefik pod, which is every node there is.
#
# `--api.dashboard=true` and `--api.insecure=true` were carried over verbatim
# from the hand-applied object when this was first adopted, and served the
# dashboard/API with no authentication to any pod in the cluster. Dropped per
# jwilleke/mj-infra-flux#177 — nothing here uses the dashboard day to day.
# `--api` alone stays: Traefik needs it internally (e.g. `/ping`), and without
# `.insecure`/`.dashboard` it is not exposed on any entrypoint.
#
# Access logs (jwilleke/mj-infra-flux#237): JSON to stdout, which the host
# fluent-bit on deby tails from /var/log/containers into Loki (30d retention).
# Filtered to problem requests only — 4xx/5xx, retries, or slower than 2s —
# because the logged path includes the query string, and YourPHR search
# endpoints carry the user's search text there. Fast, successful requests are
# never logged. Headers (cookies, Authorization) are always dropped.
# This is the only HelmChartConfig for the k3s Traefik: all Traefik values
# live here, whatever the directory name says.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--api"
    service:
      spec:
        externalTrafficPolicy: Local
    logs:
      access:
        enabled: true
        format: json
        filters:
          statuscodes: "400-599"
          retryattempts: true
          minduration: 2s
        fields:
          general:
            defaultmode: keep
          headers:
            defaultmode: drop
