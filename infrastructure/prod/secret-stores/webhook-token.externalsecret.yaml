# The image-scanning Receiver lives in infra-configs, which is applied
# before ESO exists and has no decryption. This ExternalSecret therefore
# lives here, with the ClusterSecretStore, not next to the Receiver.
# The old .env was sealed to the unavailable age1nur86 recipient, so the
# Secret Flux created held ciphertext. Bootstrap writes a new token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webhook-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: webhook-token
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: deby/flux-system/webhook-token
