# LAN/VPN only, enforced at Traefik regardless of where the name resolves.
# Depends on externalTrafficPolicy: Local so Traefik sees the real client IP
# (infrastructure/base/configs/traefik-client-ip/helmchartconfig.yaml).
# A Traefik kubernetescrd middleware ref is same-namespace only.
#
# Field is ipAllowList (Traefik v3). ipWhiteList is the v2 name.
# How this was chosen: this repo does not pin a k3s version. The live ingress
# is the k3s-bundled chart, customized only by that HelmChartConfig, which
# sets no chart version. apps/base/traefik-ingress pins chart v23.0.1
# (Traefik 2.10) but that path is not Flux-reconciled. No Middleware in the
# repo uses either allow-list field, and no Traefik CRD is vendored.
# k3s 1.32.2+ and every current 1.33+ release bundle Traefik v3, and current
# k3s docs say the bundle is Traefik v3. Default is therefore ipAllowList.
# If deby is still on k3s older than 1.32, rename this key to ipWhiteList
# before apply. An unrecognized field drops the Middleware and fail-closes
# this host only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: openbao
spec:
  ipAllowList:
    sourceRange:
      - 192.168.68.0/24
      # TODO-VPN-SUBNET: replace this entry with Jim's VPN client subnet
      # before merge. The token is not a CIDR. Traefik rejects the whole
      # Middleware, which fail-closes https://stuff.nerdsbythehour.com and
      # leaves every other Ingress alone.
      - TODO-VPN-SUBNET
