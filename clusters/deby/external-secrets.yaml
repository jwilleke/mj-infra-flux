# Operator only. The ClusterSecretStore is a separate Kustomization so a
# store that cannot reach OpenBao does not fail the operator install, and
# apps does not depend on either one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/external-secrets
  prune: true
  wait: true
  timeout: 10m0s
