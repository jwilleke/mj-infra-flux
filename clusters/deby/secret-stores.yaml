# ClusterSecretStore pointing ESO at OpenBao.
# Does not depend on the openbao Kustomization being Ready. A missing unseal
# key or a sealed store would otherwise sit in front of apps.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-stores
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infra-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/prod/secret-stores
  prune: true
  # Apply success is enough. Provider Ready waits until bootstrap has run.
  # Existing Secrets keep their last data while the store is down.
  wait: false
  timeout: 2m0s
