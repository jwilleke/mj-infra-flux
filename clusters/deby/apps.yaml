apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  # infra-configs can contain some infra changes we assume in apps.
  # infra-controllers installs the ExternalSecret CRD.
  # secret-stores applies the ClusterSecretStore (wait: false, so a sealed
  # OpenBao does not block this). openbao itself is deliberately not in
  # this list: apps must keep reconciling while the store is down.
  # Every secret under apps/production is an ExternalSecret. There is no
  # decryption provider. Git holds no ciphertext for Flux to unwrap.
  dependsOn:
    - name: infra-configs
    - name: infra-controllers
    - name: secret-stores
  sourceRef:
    kind: GitRepository
    name: flux-system
  # unlike kustomize resource paths, these paths are relative to the repo
  path: ./apps/production
  prune: true
  wait: true
  timeout: 5m0s
