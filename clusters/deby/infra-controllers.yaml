# Cluster controllers other layers wait on. External Secrets Operator today.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/prod/controllers
  prune: true
  wait: true
  timeout: 10m0s
