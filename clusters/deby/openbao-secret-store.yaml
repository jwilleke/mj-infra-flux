# wait: false. A sealed OpenBao, or a store that is not logged in yet,
# leaves this Kustomization applied and does not stall apps. apps does
# not depend on this Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-secret-store
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/openbao-secret-store
  prune: true
  wait: false
  timeout: 5m0s
